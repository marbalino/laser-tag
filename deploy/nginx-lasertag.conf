# Creek Laser Tag: http://109.123.250.254:8802/laser-tag/, behind a shared username and password
# (basic auth; the password file /etc/nginx/lasertag.htpasswd is not in git). The WebSocket is behind it too.
map $http_upgrade $lt_connection { default upgrade; '' close; }
server {
    listen 8802;
    listen [::]:8802;
    server_name _;
    root /opt/lasertag/web;
    access_log /var/log/nginx/lasertag.access.log;
    auth_basic "Creek Laser Tag";
    auth_basic_user_file /etc/nginx/lasertag.htpasswd;
    location = / { return 302 /laser-tag/; }
    location = /laser-tag { return 302 /laser-tag/; }
    location = /laser-tag/ws {
        proxy_pass http://unix:/run/lasertag/ws.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lt_connection;
        proxy_read_timeout 120s;
    }
    location /laser-tag/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        gzip on; gzip_types application/javascript application/octet-stream application/json application/wasm text/css;
    }
    location / { return 404; }
}
