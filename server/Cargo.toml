[package]
name = "lasertag-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lasertag-server"
path = "src/main.rs"

[dependencies]
lasertag-shared = { path = "../shared" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
